# compose/app/compose.yaml: vlix-ui, the only container this project runs.
# Published on loopback only; reaches the host controller through
# host.containers.internal (brief D3). No socket, no sibling mount.
services:
  ui:
    image: vlix-ui:local
    container_name: vlix-ui
    environment:
      VLIX_CONTROLLER_URL: http://host.containers.internal:${VLIX_CONTROLLER_PORT}
    ports:
      - "127.0.0.1:${VLIX_UI_PORT}:3000"
    volumes:
      - ../../.build/run/token:/run/vlix:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped
